name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift:
    name: SwiftPM
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Swift 6.3.1
        run: |
          curl -L https://download.swift.org/swiftly/darwin/swiftly.pkg -o swiftly.pkg
          installer -pkg swiftly.pkg -target CurrentUserHomeDirectory
          ~/.swiftly/bin/swiftly init --quiet-shell-followup --assume-yes --skip-install
          . "${SWIFTLY_HOME_DIR:-$HOME/.swiftly}/env.sh"
          hash -r
          swiftly install --use 6.3.1
          echo "$HOME/.swiftly/bin" >> "$GITHUB_PATH"

      - name: Show Swift version
        run: swift --version

      - name: Build
        run: swift build

      - name: Test
        run: |
          perl -e 'alarm shift; exec @ARGV' 30 \
            xcodebuild test \
              -workspace .swiftpm/xcode/package.xcworkspace \
              -scheme SwiftCAD-Package \
              -destination 'platform=macOS' \
              -parallel-testing-enabled NO \
              -only-testing:CADGeometryTests \
              -only-testing:CADIRTests/CADCommandTests \
              -only-testing:CADTopologyTests/BRepValidationLevelTests \
              -only-testing:CADModelingTests \
              -only-testing:CADKernelTests/KernelCapabilityContractTests \
              -only-testing:CADKernelTests/DeferredArtifactEvaluationTests \
              -only-testing:CADExchangeTests/ExactSTEPExchangeTests \
              -only-testing:CADExchangeTests/ExactIGESExchangeTests \
              -only-testing:CADExchangeTests/USDExchangePureSwiftImportTests \
              -only-testing:CADExchangeTests/USDExporterCodecTests \
              -only-testing:SwiftCADTests/CADCommandPipelineTests \
              CODE_SIGNING_ALLOWED=NO

      - name: Check forbidden Swift patterns
        run: python3 Scripts/check_swift_policy.py Sources Tests

      - name: Check zero-copy transport regressions
        run: python3 Scripts/check_swift_policy.py --zero-copy Sources/CADExchange Sources/SwiftCAD

      - name: Check explicit kernel tolerance contract
        run: python3 Scripts/check_swift_policy.py --tolerance-contract Sources

      - name: Check capability ledger
        run: python3 Scripts/check_capability_ledger.py

  wasm:
    name: WebAssembly
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Swift 6.3.1
        run: |
          curl -L https://download.swift.org/swiftly/darwin/swiftly.pkg -o swiftly.pkg
          installer -pkg swiftly.pkg -target CurrentUserHomeDirectory
          ~/.swiftly/bin/swiftly init --quiet-shell-followup --assume-yes --skip-install
          . "${SWIFTLY_HOME_DIR:-$HOME/.swiftly}/env.sh"
          hash -r
          swiftly install --use 6.3.1
          echo "$HOME/.swiftly/bin" >> "$GITHUB_PATH"

      - name: Install Swift WebAssembly SDK
        run: |
          swift sdk install \
            https://download.swift.org/swift-6.3.1-release/wasm-sdk/swift-6.3.1-RELEASE/swift-6.3.1-RELEASE_wasm.artifactbundle.tar.gz \
            --checksum bd47baa20771f366d8beed7970afaa30742b2210097afd15f85427226d8f4cf2

      - name: Build for WebAssembly
        run: swiftly run swift build --swift-sdk swift-6.3.1-RELEASE_wasm +6.3.1
