name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apple-platforms:
    name: ${{ matrix.name }} build
    runs-on: macos-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            destination: platform=macOS,arch=arm64
            artifact: macos-build
          - name: iOS
            destination: generic/platform=iOS
            artifact: ios-build
          - name: visionOS
            destination: generic/platform=visionOS
            artifact: visionos-build

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build SwiftCAD facade
        env:
          BUILD_LOG: ${{ runner.temp }}/${{ matrix.artifact }}-${{ github.sha }}.log
        run: |
          set -o pipefail
          xcodebuild build \
            -scheme SwiftCAD \
            -destination '${{ matrix.destination }}' \
            -derivedDataPath "${RUNNER_TEMP}/${{ matrix.artifact }}-derived" \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee "$BUILD_LOG"

      - name: Preserve revision-bound build evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}-${{ github.sha }}
          path: ${{ runner.temp }}/${{ matrix.artifact }}-${{ github.sha }}.log
          if-no-files-found: error

  swift:
    name: SwiftPM
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Swift 6.4 development snapshot
        run: |
          curl -L https://download.swift.org/swiftly/darwin/swiftly.pkg -o swiftly.pkg
          installer -pkg swiftly.pkg -target CurrentUserHomeDirectory
          ~/.swiftly/bin/swiftly init --quiet-shell-followup --assume-yes --skip-install
          . "${SWIFTLY_HOME_DIR:-$HOME/.swiftly}/env.sh"
          hash -r
          swiftly install --use 6.4.x-snapshot-2026-08-14
          echo "$HOME/.swiftly/bin" >> "$GITHUB_PATH"

      - name: Show Swift version
        run: swift --version

      - name: Build
        run: swiftly run swift build +6.4.x-snapshot-2026-08-14

      - name: Test
        env:
          TOOLCHAINS: com.apple.dt.toolchain.XcodeDefault
        run: |
          perl -e 'alarm shift; exec @ARGV' 1800 \
            xcodebuild test \
              -workspace .swiftpm/xcode/package.xcworkspace \
              -scheme SwiftCAD-Package \
              -destination 'platform=macOS' \
              -parallel-testing-enabled NO \
              -only-testing:CADGeometryTests \
              -only-testing:CADIRTests/CADCommandTests \
              -only-testing:CADTopologyTests/BRepValidationLevelTests \
              -only-testing:CADModelingTests \
              -only-testing:CADKernelTests/KernelCapabilityContractTests \
              -only-testing:CADKernelTests/DeferredArtifactEvaluationTests \
              -only-testing:CADExchangeTests/ExactSTEPExchangeTests \
              -only-testing:CADExchangeTests/ExactIGESExchangeTests \
              -only-testing:CADExchangeTests/USDExchangePureSwiftImportTests \
              -only-testing:CADExchangeTests/USDExporterCodecTests \
              -only-testing:SwiftCADTests/CADCommandPipelineTests \
              CODE_SIGNING_ALLOWED=NO

      - name: Check forbidden Swift patterns
        run: python3 Scripts/check_swift_policy.py Sources Tests

      - name: Check zero-copy transport regressions
        run: python3 Scripts/check_swift_policy.py --zero-copy Sources/CADExchange Sources/SwiftCAD

      - name: Check explicit kernel tolerance contract
        run: python3 Scripts/check_swift_policy.py --tolerance-contract Sources

      - name: Check capability ledger
        run: python3 Scripts/check_capability_ledger.py

      - name: Check public contract inventory
        run: python3 Scripts/check_public_contract_inventory.py

      - name: Check uncompromising completion contract
        run: python3 Scripts/check_goal_contract.py

  wasm:
    name: WebAssembly
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Swift 6.4 development snapshot
        run: |
          curl -L https://download.swift.org/swiftly/darwin/swiftly.pkg -o swiftly.pkg
          installer -pkg swiftly.pkg -target CurrentUserHomeDirectory
          ~/.swiftly/bin/swiftly init --quiet-shell-followup --assume-yes --skip-install
          . "${SWIFTLY_HOME_DIR:-$HOME/.swiftly}/env.sh"
          hash -r
          swiftly install --use 6.4.x-snapshot-2026-08-14
          echo "$HOME/.swiftly/bin" >> "$GITHUB_PATH"

      - name: Install Swift WebAssembly SDK
        run: |
          swift sdk install \
            https://download.swift.org/swift-6.4.x-branch/wasm-sdk/swift-6.4.x-DEVELOPMENT-SNAPSHOT-2026-08-14-a/swift-6.4.x-DEVELOPMENT-SNAPSHOT-2026-08-14-a_wasm.artifactbundle.tar.gz \
            --checksum 11fabfac6804222569d330fbbb5fa34eef736abda46790e723ac73b256fd1c7a

      - name: Build and run WebAssembly smoke
        env:
          BUILD_LOG: ${{ runner.temp }}/wasm-build-${{ github.sha }}.log
          RUNTIME_LOG: ${{ runner.temp }}/wasm-runtime-${{ github.sha }}.log
        run: |
          set -o pipefail
          swiftly run swift build \
            --scratch-path .build/wasm-ci \
            --configuration release \
            --product CADWASMSmoke \
            --swift-sdk swift-6.4.x-DEVELOPMENT-SNAPSHOT-2026-08-14-a_wasm \
            +6.4.x-snapshot-2026-08-14 \
            2>&1 | tee "$BUILD_LOG"
          WASM_BIN_PATH=$(swiftly run swift build \
            --scratch-path .build/wasm-ci \
            --configuration release \
            --show-bin-path \
            --swift-sdk swift-6.4.x-DEVELOPMENT-SNAPSHOT-2026-08-14-a_wasm \
            +6.4.x-snapshot-2026-08-14)
          node --no-warnings --experimental-wasi-unstable-preview1 \
            Scripts/run_wasi_smoke.mjs \
            "$WASM_BIN_PATH/CADWASMSmoke.wasm" \
            2>&1 | tee "$RUNTIME_LOG"

      - name: Preserve revision-bound WebAssembly evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: wasm-build-${{ github.sha }}
          path: |
            ${{ runner.temp }}/wasm-build-${{ github.sha }}.log
            ${{ runner.temp }}/wasm-runtime-${{ github.sha }}.log
          if-no-files-found: error
